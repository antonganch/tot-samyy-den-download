name: Update evening TV listings
on:
  schedule:
    - cron: '27 3,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/update_evening_tv.py
      - run: |
          git add v1/charts
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -m 'Refresh dated evening TV listings'
            git pull --rebase && git push
          fi
