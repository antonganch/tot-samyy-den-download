name: Refresh published retail observations
on:
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: retail-prices
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/download_wfp_food.py "$RUNNER_TEMP/wfp"
      - run: python3 tools/import_wfp_food.py "$RUNNER_TEMP/wfp" tools/food-market-names.json
      - run: |
          git add v1/food
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -m 'Refresh WFP retail observations'
            git pull --rebase && git push
          fi
